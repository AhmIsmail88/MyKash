name: mykash
description: MyKash - كاشير ونقاط بيع أوفلاين لأي محل (أندرويد + ويندوز)
publish_to: 'none'
version: 0.7.1+8

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  drift: ^2.20.0
  drift_flutter: ^0.2.0
  uuid: ^4.4.0
  crypto: ^3.0.3
  mobile_scanner: ^5.2.3
  pdf: ^3.11.1
  printing: ^5.13.1
  barcode: ^2.2.8
  shelf: ^1.4.1
  qr_flutter: ^4.1.0
  path_provider: ^2.1.4
  path: ^1.9.0
  share_plus: ^10.1.2
  file_picker: ^8.1.2
  cryptography: ^2.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  drift_dev: ^2.20.0
  build_runner: ^2.4.11
  flutter_launcher_icons: ^0.14.0

flutter:
  uses-material-design: true
  assets:
    - assets/branding/
    - assets/fonts/
  # لاحقًا: نزّل خط Cairo وضعه في assets/fonts ثم فعّل:
  # fonts:
  #   - family: Cairo
  #     fonts:
  #       - asset: assets/fonts/Cairo-Regular.ttf
  #       - asset: assets/fonts/Cairo-Bold.ttf
  #         weight: 700

flutter_launcher_icons:
  android: true
  image_path: assets/branding/icon_full.png
  adaptive_icon_background: "#0B6B57"
  adaptive_icon_foreground: assets/branding/icon_foreground.png
  windows:
    generate: true
    image_path: assets/branding/icon_full.png
    icon_size: 256
